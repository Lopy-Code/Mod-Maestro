<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModMaestro</title>
<meta name="description" content="Le chef d'orchestre de ton modpack Minecraft.">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/static/css/theme.css">
<script>
  try {
    var t = localStorage.getItem("mm-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="Navigation">
    <div class="brand">
      <img src="/assets/logo.svg" alt="" width="38" height="38">
      <div class="brand-name">Mod<span>Maestro</span></div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item" data-view="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="Accueil">Accueil</span></button>
      <button class="nav-item" data-view="audit" disabled><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8.2-8 9-4.8-.8-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><span data-t="Audit">Audit</span><b class="badge" id="badge-audit" hidden></b></button>
      <button class="nav-item" data-view="mods" disabled><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg><span data-t="Mods">Mods</span><b class="badge muted" id="badge-mods" hidden></b></button>
      <button class="nav-item" data-view="tips" disabled><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span data-t="Conseils">Conseils</span></button>
      <button class="nav-item" data-view="server" disabled><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg><span data-t="Serveur">Serveur</span></button>
      <button class="nav-item" data-view="export" disabled><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg><span data-t="Exporter">Exporter</span></button>
      <button class="nav-item" data-view="compare"><svg viewBox="0 0 24 24"><path d="M8 3v18M16 3v18M3 8h5M16 16h5"/></svg><span data-t="Comparer">Comparer</span></button>
      <button class="nav-item" data-view="crash"><svg viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg><span data-t="Crash">Crash</span></button>
      <button class="nav-item" data-view="base"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg><span data-t="Ma base">Ma base</span></button>
    </nav>

    <div class="sidebar-foot">
      <div class="seg" role="group" aria-label="Langue / Language">
        <button data-lang="fr" aria-pressed="true">FR</button><button data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="ghost-btn" id="motion-toggle" data-t-title="Animations" title="Animations" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M5 12c2-6 5-6 7 0s5 6 7 0"/></svg><span data-t="Animations">Animations</span>
      </button>
      <button class="ghost-btn" id="theme-toggle" data-t-title="Changer de thème" title="Changer de thème">
        <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg viewBox="0 0 24 24" class="i-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        <span data-t="Thème">Thème</span>
      </button>
      <div class="version" id="version"></div>
    </div>
  </aside>

  <main class="stage">
    <div class="panel" id="panel">
      <header class="topbar" id="topbar" hidden>
        <div class="crumbs">
          <div class="crumb-title" id="crumb-title"></div>
          <div class="crumb-path" id="crumb-path"></div>
        </div>
        <div class="topbar-actions">
          <button class="btn" id="btn-export" data-t="Exporter">Exporter</button>
          <button class="btn primary" id="btn-new" data-t="Nouvelle analyse">Nouvelle analyse</button>
        </div>
      </header>
      <div class="view" id="view" tabindex="-1"></div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title" data-t="Choisir un dossier">Choisir un dossier</h2>
      <button class="icon-btn" id="modal-close" data-t-title="Fermer" aria-label="Fermer">×</button>
    </div>
    <div class="modal-path">
      <button class="icon-btn" id="browse-up" data-t-title="Dossier parent" title="Dossier parent" aria-label="Dossier parent">↑</button>
      <input id="browse-path" spellcheck="false" aria-label="Chemin">
      <button class="btn" id="browse-go" data-t="Aller">Aller</button>
    </div>
    <div class="modal-body">
      <div class="shortcuts" id="shortcuts"></div>
      <ul class="dirlist" id="dirlist"></ul>
    </div>
    <div class="modal-foot">
      <div class="modal-hint" id="browse-hint"></div>
      <button class="btn primary" id="browse-pick">Analyser ce dossier</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="dlg" hidden>
  <div class="modal dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <div class="modal-head"><h2 id="dlg-title"></h2><button class="icon-btn" id="dlg-close" data-t-title="Fermer" aria-label="Fermer">×</button></div>
    <div class="dlg-body" id="dlg-body"></div>
    <div class="modal-foot" id="dlg-foot"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>window.MM = /*__MM_CONFIG__*/{};</script>
<script src="/static/js/lib.js"></script>
<script src="/static/js/views-core.js"></script>
<script src="/static/js/views-new.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
